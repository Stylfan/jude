# Jude on one server: Postgres, a one-off migration step and the app.
# The one outside service is Mistral (EU), for speech and the model; see
# docs/subprocessors.md and docs/self-hosting.md.
#
#   cp .env.production.example .env.production   # fill in the three secrets
#   docker compose --env-file .env.production up -d --build
#
# The app listens on 127.0.0.1:3002; put a reverse proxy with HTTPS in
# front of it (Caddy, nginx, Coolify's Traefik).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: jude
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jude"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: migrator
    # Runs once and stops; the app starts when it has. Said outright, because
    # Coolify otherwise gives every service a restart policy and it never ends.
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/jude
      JUDE_APP_PASSWORD: ${JUDE_APP_PASSWORD:?set JUDE_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      APP_DATABASE_URL: postgres://jude_app:${JUDE_APP_PASSWORD}@db:5432/jude
      JUDE_SECRET: ${JUDE_SECRET:?set JUDE_SECRET}
      JUDE_URL: ${JUDE_URL:?set JUDE_URL}
      JUDE_SIGNUP: ${JUDE_SIGNUP:-}
      JUDE_OPERATOR_NAME: ${JUDE_OPERATOR_NAME:-}
      JUDE_OPERATOR_EMAIL: ${JUDE_OPERATOR_EMAIL:-}
      JUDE_OPERATOR_ADDRESS: ${JUDE_OPERATOR_ADDRESS:-}
      JUDE_HOSTING: ${JUDE_HOSTING:-}
      JUDE_DEMO: ${JUDE_DEMO:-}
      JUDE_SOURCE_URL: ${JUDE_SOURCE_URL:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?set MISTRAL_API_KEY}
      JUDE_VOICES: ${JUDE_VOICES:-}
      JUDE_CHAT_MODEL: ${JUDE_CHAT_MODEL:-}
      JUDE_TRANSCRIBE_MODEL: ${JUDE_TRANSCRIBE_MODEL:-}
      JUDE_SPEECH_MODEL: ${JUDE_SPEECH_MODEL:-}
      JUDE_MODERATION_MODEL: ${JUDE_MODERATION_MODEL:-}
      JUDE_MINUTES_PER_CONVERSATION: ${JUDE_MINUTES_PER_CONVERSATION:-}
      JUDE_TURNS_PER_CONVERSATION: ${JUDE_TURNS_PER_CONVERSATION:-}
      JUDE_ACCOUNT_CONVERSATIONS_PER_DAY: ${JUDE_ACCOUNT_CONVERSATIONS_PER_DAY:-}
      JUDE_SERVER_CONVERSATIONS_PER_DAY: ${JUDE_SERVER_CONVERSATIONS_PER_DAY:-}
    ports:
      # 3002, so it can sit beside Prismatic (3000) and Distil (3001) on one server.
      - "127.0.0.1:3002:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
